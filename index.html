<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equipment Self-Catalog — Bright Star Auctions</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Self-Catalog">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#C1701F">
<style>
  :root{
    --paper:#F5F1E7; --ink:#1B1F24; --steel:#5B6472; --steel-soft:#D9D4C6;
    --accent:#C1701F; --accent-ink:#FFFFFF; --good:#3F7D58; --warn:#AD3B24;
    --surface:#FFFFFF; --surface-2:#ECE6D6; --line:#D9D4C6;
    --radius:9px;
    --font-display:"Arial Narrow","Helvetica Neue Condensed","Segoe UI Semibold",sans-serif;
    --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#15181C; --ink:#EDE8DB; --steel:#8B93A0; --steel-soft:#2B3038;
      --accent:#E08A3C; --accent-ink:#1A1000; --good:#6FBE8B; --warn:#E2725A;
      --surface:#1C2025; --surface-2:#20242A; --line:#31363D;
    }
  }
  :root[data-theme="dark"]{
    --paper:#15181C; --ink:#EDE8DB; --steel:#8B93A0; --steel-soft:#2B3038;
    --accent:#E08A3C; --accent-ink:#1A1000; --good:#6FBE8B; --warn:#E2725A;
    --surface:#1C2025; --surface-2:#20242A; --line:#31363D;
  }
  :root[data-theme="light"]{
    --paper:#F5F1E7; --ink:#1B1F24; --steel:#5B6472; --steel-soft:#D9D4C6;
    --accent:#C1701F; --accent-ink:#FFFFFF; --good:#3F7D58; --warn:#AD3B24;
    --surface:#FFFFFF; --surface-2:#ECE6D6; --line:#D9D4C6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--font-body); line-height:1.45;
    -webkit-tap-highlight-color:transparent;
  }
  #app{max-width:640px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}
  button{font-family:inherit; cursor:pointer;}
  input,textarea,select{font-family:inherit;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  header.topbar{
    position:sticky; top:0; z-index:5; background:var(--paper);
    border-bottom:1px solid var(--line); padding:12px 16px 10px;
  }
  .brandrow{display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
  .brand{
    font-family:var(--font-display); font-stretch:condensed; font-weight:800;
    text-transform:uppercase; letter-spacing:.03em; font-size:15px; color:var(--ink);
  }
  .brand small{display:block; font-family:var(--font-body); font-weight:400; text-transform:none;
    letter-spacing:0; color:var(--steel); font-size:11px; margin-top:1px;}
  .lotbadge{
    font-family:var(--font-mono); font-size:11px; color:var(--steel);
    border:1px solid var(--line); border-radius:20px; padding:3px 10px; white-space:nowrap;
  }
  .stagetrack{display:flex; gap:4px; margin-top:10px;}
  .stagetrack i{flex:1; height:4px; border-radius:2px; background:var(--steel-soft); display:block;}
  .stagetrack i.done{background:var(--good);}
  .stagetrack i.active{background:var(--accent);}

  main{flex:1; padding:20px 16px 12px;}
  .stagelabel{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--accent); margin:0 0 6px;
  }
  h1.screentitle{
    font-family:var(--font-display); font-stretch:condensed; font-weight:800;
    text-transform:uppercase; letter-spacing:.01em; font-size:26px; margin:0 0 4px;
    text-wrap:balance;
  }
  p.sub{color:var(--steel); margin:0 0 18px; font-size:14.5px; max-width:34em;}

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; margin-bottom:14px;
  }
  .tagcard{position:relative; padding-top:18px;}
  .tagcard::before{
    content:""; position:absolute; top:0; left:16px; width:34px; height:6px;
    background:var(--accent); border-radius:0 0 4px 4px;
  }

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .field{display:flex; flex-direction:column; gap:5px; margin-bottom:12px;}
  .field label{font-size:12px; font-weight:600; color:var(--steel); text-transform:uppercase; letter-spacing:.03em;}
  .field .hint{font-size:12px; color:var(--steel); font-weight:400; text-transform:none; letter-spacing:0;}
  .field input[type=text], .field input[type=number], .field input[type=tel], .field input[type=email], .field textarea{
    border:1px solid var(--line); border-radius:6px; padding:10px 11px; background:var(--paper);
    color:var(--ink); font-size:15px; font-family:var(--font-mono);
  }
  .field textarea{font-family:var(--font-body); resize:vertical; min-height:64px;}
  .field input:focus, .field textarea:focus{border-color:var(--accent);}

  .catgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .catbtn{
    text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 12px; display:flex; flex-direction:column; gap:2px;
  }
  .catbtn .name{font-family:var(--font-display); font-stretch:condensed; font-weight:800; text-transform:uppercase; font-size:15px;}
  .catbtn .desc{font-size:12px; color:var(--steel);}
  .catbtn:hover, .catbtn:focus-visible{border-color:var(--accent);}

  .photostep .frame{
    border:2px dashed var(--line); border-radius:var(--radius); background:var(--surface-2);
    min-height:220px; display:flex; align-items:center; justify-content:center; overflow:hidden;
    position:relative; margin-bottom:12px;
  }
  .photostep .frame img{width:100%; height:100%; object-fit:cover; display:block;}
  .photostep .frame .placeholder{color:var(--steel); font-size:13px; text-align:center; padding:20px;}
  .photostep .frame .na{color:var(--steel); font-size:13px; font-style:italic;}
  .stepmeta{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:2px;}
  .stepcount{font-family:var(--font-mono); font-size:12px; color:var(--steel);}
  .req{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--warn); font-weight:700;}
  .tip{
    font-size:13px; color:var(--steel); background:var(--surface-2); border-radius:6px;
    padding:8px 10px; margin-top:10px; border-left:3px solid var(--accent);
  }

  .btnrow{display:flex; gap:10px; flex-wrap:wrap;}
  .btn{
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    border-radius:7px; padding:11px 16px; font-size:14px; font-weight:600;
  }
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .btn.ghost{background:transparent;}
  .btn.full{width:100%; text-align:center;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btn.warn{border-color:var(--warn); color:var(--warn); background:transparent;}

  footer.navbar{
    position:sticky; bottom:0; background:var(--paper); border-top:1px solid var(--line);
    padding:12px 16px; display:flex; gap:10px;
  }
  footer.navbar .btn{flex:1;}

  .qrow{border-bottom:1px solid var(--line); padding:12px 0;}
  .qrow:last-child{border-bottom:none;}
  .qrow legend, .qrow .qlabel{font-size:14px; font-weight:600; margin-bottom:8px; display:block;}
  .qrow .qhint{font-size:12.5px; color:var(--steel); margin-top:-4px; margin-bottom:8px;}
  .choices{display:flex; gap:8px; flex-wrap:wrap;}
  .choices label{
    border:1px solid var(--line); border-radius:20px; padding:6px 13px; font-size:13px;
    display:flex; align-items:center; gap:6px; background:var(--surface);
  }
  .choices input{accent-color:var(--accent);}
  .choices label.picked{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, var(--surface));}

  .callout{
    background:var(--surface-2); border-radius:var(--radius); padding:14px 15px; margin-bottom:16px;
    border:1px solid var(--line);
  }
  .callout h3{margin:0 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--accent);}
  .callout ol{margin:0; padding-left:20px; font-size:13.5px; color:var(--ink);}
  .callout li{margin-bottom:6px;}
  .callout li b{color:var(--ink);}

  .checkgrid{display:flex; flex-direction:column; gap:8px;}
  .checkgrid label{display:flex; align-items:flex-start; gap:9px; font-size:14px;}
  .checkgrid input{margin-top:3px; accent-color:var(--accent);}

  .damagelist{display:flex; flex-direction:column; gap:10px; margin-top:10px;}
  .damageitem{display:flex; gap:10px; border:1px solid var(--line); border-radius:8px; padding:10px; align-items:flex-start;}
  .damageitem img{width:56px; height:56px; object-fit:cover; border-radius:6px; flex-shrink:0; background:var(--surface-2);}
  .damageitem .txt{flex:1; font-size:13.5px;}
  .damageitem .rm{background:none; border:none; color:var(--warn); font-size:12px; font-weight:700;}

  .thumbgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px;}
  .thumbgrid .t{aspect-ratio:1; border-radius:6px; overflow:hidden; position:relative; background:var(--surface-2);}
  .thumbgrid .t img{width:100%; height:100%; object-fit:cover;}
  .thumbgrid .t .lbl{
    position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,.55); color:#fff;
    font-size:9.5px; padding:3px 5px; line-height:1.2;
  }
  .thumbgrid .t.missing{display:flex; align-items:center; justify-content:center; border:1px dashed var(--warn);}
  .thumbgrid .t.missing span{font-size:10px; color:var(--warn); text-align:center; padding:4px;}

  .kv{display:grid; grid-template-columns:auto 1fr; gap:5px 12px; font-size:14px;}
  .kv dt{color:var(--steel);}
  .kv dd{margin:0; font-family:var(--font-mono);}

  .lotchip{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px;
    background:var(--surface);
  }
  .lotchip .nm{font-weight:700; font-size:14px;}
  .lotchip .meta{font-size:12px; color:var(--steel); font-family:var(--font-mono);}

  .pill{font-size:11px; padding:2px 9px; border-radius:20px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;}
  .pill.good{background:color-mix(in srgb, var(--good) 18%, var(--surface)); color:var(--good);}
  .pill.warn{background:color-mix(in srgb, var(--warn) 18%, var(--surface)); color:var(--warn);}

  .empty{color:var(--steel); font-size:14px; text-align:center; padding:30px 10px;}
  .center{text-align:center;}
  .bigicon{font-size:44px; line-height:1; margin-bottom:6px;}
  .fineprint{font-size:12px; color:var(--steel); margin-top:14px;}
  a{color:var(--accent);}
  @media (prefers-reduced-motion: no-preference){
    .card, .catbtn{transition:border-color .15s ease;}
  }
</style>
</head>

<div id="app"></div>

<script>
(function(){
  "use strict";

  var EMAIL_TO = "drewl@brightstarauctions.com"; // change to your cataloging intake address

  var SUPABASE_URL = "https://johrcgvbpwmlyhepckyo.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpvaHJjZ3ZicHdtbHloZXBja3lvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4MTcwNTEsImV4cCI6MjEwMTM5MzA1MX0.4dPLdUYNuFP9zDflQCYJ62YtK-yFXI0UDBF2VKr6y8g";

  function supaReady(){
    return SUPABASE_URL.indexOf("YOUR_SUPABASE") === -1 && SUPABASE_ANON_KEY.indexOf("YOUR_SUPABASE") === -1;
  }

  function uuid(){
    if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c){
      var r = Math.random()*16|0, v = c==="x" ? r : (r&0x3|0x8);
      return v.toString(16);
    });
  }

  function dataUrlToBlob(dataUrl){
    var parts = dataUrl.split(",");
    var mime = parts[0].match(/:(.*?);/)[1];
    var bin = atob(parts[1]);
    var bytes = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return new Blob([bytes], {type:mime});
  }

  function safeExt(name, fallback){
    var m = /\.([a-zA-Z0-9]+)$/.exec(name||"");
    return m ? m[1].toLowerCase() : fallback;
  }

  function withRetry(fn, attemptsLeft){
    attemptsLeft = attemptsLeft==null ? 3 : attemptsLeft;
    return fn().catch(function(err){
      if(attemptsLeft <= 1) throw err;
      return new Promise(function(resolve){ setTimeout(resolve, 1500); }).then(function(){
        return withRetry(fn, attemptsLeft-1);
      });
    });
  }

  function supaUpload(path, blob, contentType){
    return withRetry(function(){
      return fetch(SUPABASE_URL+"/storage/v1/object/catalog-uploads/"+path, {
        method:"POST",
        headers:{
          "apikey":SUPABASE_ANON_KEY,
          "Authorization":"Bearer "+SUPABASE_ANON_KEY,
          "Content-Type":contentType||"application/octet-stream"
        },
        body:blob
      }).then(function(res){
        if(!res.ok) throw new Error("Upload failed: "+path);
        return path;
      });
    });
  }

  function supaInsertLot(payload){
    return withRetry(function(){
      return fetch(SUPABASE_URL+"/rest/v1/lots", {
        method:"POST",
        headers:{
          "apikey":SUPABASE_ANON_KEY,
          "Authorization":"Bearer "+SUPABASE_ANON_KEY,
          "Content-Type":"application/json",
          "Prefer":"return=minimal"
        },
        body:JSON.stringify(payload)
      }).then(function(res){
        if(!res.ok) throw new Error("Insert failed");
        return payload;
      });
    });
  }

  function submitLotToSupabase(lot, onProgress){
    var lotId = uuid();
    var cat = CATEGORIES[lot.category];
    var uploads = [];
    var photoRefs = [];
    var totalFiles = 0, doneFiles = 0;

    cat.steps.forEach(function(s){ if(lot.photos[s.id]) totalFiles++; });
    lot.damage.forEach(function(d){ if(d.dataUrl) totalFiles++; });
    if(lot.video && lot.video.file) totalFiles++;

    function bump(){ doneFiles++; if(onProgress) onProgress(doneFiles, totalFiles); }

    cat.steps.forEach(function(s){
      var dataUrl = lot.photos[s.id];
      if(dataUrl){
        var path = lotId+"/photo-"+s.id+".jpg";
        uploads.push(
          supaUpload(path, dataUrlToBlob(dataUrl), "image/jpeg").then(function(){
            photoRefs.push({stepId:s.id, title:s.title, path:path});
            bump();
          })
        );
      }
    });

    var damageRefs = [];
    lot.damage.forEach(function(d, i2){
      if(d.dataUrl){
        var path = lotId+"/damage-"+i2+".jpg";
        uploads.push(
          supaUpload(path, dataUrlToBlob(d.dataUrl), "image/jpeg").then(function(){
            damageRefs.push({note:d.note, path:path});
            bump();
          })
        );
      }
    });

    var videoRef = lot.video && lot.video.na ? {na:true} : null;
    if(lot.video && lot.video.file){
      var vpath = lotId+"/video."+safeExt(lot.video.name, "mp4");
      uploads.push(
        supaUpload(vpath, lot.video.file, lot.video.file.type || "video/mp4").then(function(){
          videoRef = {name:lot.video.name, size:lot.video.size, path:vpath};
          bump();
        })
      );
    }

    return Promise.all(uploads).then(function(){
      return supaInsertLot({
        id: lotId,
        category: lot.category,
        info: lot.info,
        condition: lot.cond,
        attach: {list:lot.attach, other:lot.attachOther},
        photos: photoRefs,
        damage: damageRefs,
        video: videoRef
      });
    });
  }

  var CATEGORIES = {
    tracked:{
      label:"Tracked Equipment", desc:"Excavators, dozers, tracked loaders",
      steps:[
        {id:"front-left", title:"Front-left corner", instr:"Start here. Back up until the whole machine fits in frame, shot from the front-left corner.", tip:"Tracks to top of cab — nothing cropped off."},
        {id:"side-left", title:"Left side", instr:"Walk down the left side, stand directly opposite the middle, full profile of the machine."},
        {id:"rear-left", title:"Back-left corner", instr:"Keep walking to the back-left corner, full machine in frame."},
        {id:"rear-straight", title:"Back side", instr:"Stand directly behind, centered on the machine."},
        {id:"rear-right", title:"Back-right corner", instr:"Full machine in frame from the back-right corner."},
        {id:"side-right", title:"Right side", instr:"Walk up the right side, stand directly opposite the middle, full profile of the machine."},
        {id:"front-right", title:"Right-front corner", instr:"Full machine in frame from the right-front corner — you're back where you started, on the other side."},
        {id:"front-straight", title:"Front side", instr:"Stand directly in front, centered on the machine — loop complete."},
        {id:"serial-plate", title:"Serial / ID plate", instr:"Fill the frame with the plate — every character must be readable.", tip:"Cross-check it matches your title or registration."},
        {id:"hour-meter", title:"Hour meter reading", instr:"Photograph the meter display clearly showing current hours.", tip:"Key to accessory power if the screen is dark."},
        {id:"cab-seat", title:"Cab interior — seat", instr:"Shot of the seat and side controls from the door opening."},
        {id:"cab-dash", title:"Cab interior — dash & gauges", instr:"Shot of the dash, gauges, and any warning lights lit."},
        {id:"cab-roof", title:"Cab interior — roof & grab handles", instr:"Shot upward showing the headliner, grab handles, and roof condition."},
        {id:"cab-floor", title:"Cab interior — floor & pedals", instr:"Shot of the floor mat and foot pedals from the seat."},
        {id:"engine-bay", title:"Engine compartment — overall", instr:"Open the hood/side doors and photograph the full engine bay.", naAllowed:true},
        {id:"engine-belts", title:"Engine — belts & hoses close-up", instr:"Close-up on belts and hoses — look for cracking or wear.", naAllowed:true},
        {id:"radiator", title:"Radiator / cooling fins", instr:"Close-up of the radiator face — check for bent fins or debris.", naAllowed:true},
        {id:"undercarriage-l-full", title:"Left track — full length", instr:"Get low, capture the entire left track from front to back."},
        {id:"undercarriage-l-drive", title:"Left track — sprocket & final drive", instr:"Close-up of the drive sprocket and final drive housing."},
        {id:"undercarriage-l-idler", title:"Left track — front idler & rollers", instr:"Close-up of the front idler and track rollers."},
        {id:"undercarriage-r-full", title:"Right track — full length", instr:"Same shot, opposite side."},
        {id:"undercarriage-r-drive", title:"Right track — sprocket & final drive", instr:"Close-up of the drive sprocket and final drive housing."},
        {id:"undercarriage-r-idler", title:"Right track — front idler & rollers", instr:"Close-up of the front idler and track rollers."},
        {id:"pad-wear-l", title:"Left track pad wear", instr:"Close-up on a few pads — show remaining pad height.", tip:"Worn pads and sprockets are a $5,000-$15,000 repair — buyers look here first."},
        {id:"pad-wear-r", title:"Right track pad wear", instr:"Same shot, opposite side."},

        {id:"attachment-edge", title:"Attachment — cutting edge / teeth", instr:"Close-up of the bucket teeth or cutting edge showing wear.", naAllowed:true},
        {id:"attachment-pins", title:"Attachment pins & bushings", instr:"Close-up of the pins and bushings connecting the attachment.", naAllowed:true},
        {id:"hydraulics-boom", title:"Boom cylinder close-up", instr:"Close-up of the boom cylinder — look for weeping or scoring.", naAllowed:true},

        {id:"structure-rear", title:"Counterweight / rear frame", instr:"Shot of the counterweight and rear frame structure."}
      ],
      attachments:["Bucket","Quick coupler / thumb","Blade","Ripper"]
    },
    wheeled:{
      label:"Wheeled Machine", desc:"Loaders, graders, wheeled skid steers",
      steps:[
        {id:"front-left", title:"Front-left corner", instr:"Start here. Back up until the whole machine fits in frame, shot from the front-left corner."},
        {id:"side-left", title:"Left side", instr:"Walk down the left side, stand directly opposite the middle, full profile of the machine."},
        {id:"rear-left", title:"Back-left corner", instr:"Keep walking to the back-left corner, full machine in frame."},
        {id:"rear-straight", title:"Back side", instr:"Stand directly behind, centered on the machine."},
        {id:"rear-right", title:"Back-right corner", instr:"Full machine in frame from the back-right corner."},
        {id:"side-right", title:"Right side", instr:"Walk up the right side, stand directly opposite the middle, full profile of the machine."},
        {id:"front-right", title:"Right-front corner", instr:"Full machine in frame from the right-front corner — you're back where you started, on the other side."},
        {id:"front-straight", title:"Front side", instr:"Stand directly in front, centered on the machine — loop complete."},
        {id:"serial-plate", title:"Serial / ID plate", instr:"Fill the frame with the plate — every character must be readable."},
        {id:"hour-meter", title:"Hour meter reading", instr:"Photograph the meter display clearly showing current hours."},
        {id:"cab-seat", title:"Cab / operator area — seat", instr:"Shot of the seat and controls from the door or platform."},
        {id:"cab-dash", title:"Cab / operator area — dash & gauges", instr:"Shot of the dash, gauges, and any warning lights lit."},
        {id:"cab-floor", title:"Cab / operator area — floor & pedals", instr:"Shot of the floor and foot pedals from the seat."},
        {id:"engine-bay", title:"Engine compartment — overall", instr:"Open the hood and photograph the full engine bay.", naAllowed:true},
        {id:"engine-belts", title:"Engine — belts & hoses close-up", instr:"Close-up on belts and hoses — look for cracking or wear.", naAllowed:true},
        {id:"tire-fl-tread", title:"Tire — front left, tread", instr:"Straight-on shot of the tread face — note wear pattern."},

  var state = {
    screen:"welcome",
    photoIndex:0,
    lotNum:1,
    lots:[],
    cur:freshLot()
  };

  function freshLot(){
    return {
      category:null,
      info:{seller:"", make:"", model:"", year:"", serial:"", meter:"", location:""},
      photos:{}, naFlags:{},
      video:null,
      damage:[],
      cond:{starts:"", moves:"", hydraulics:"", lights:"", leaks:"", issues:"", records:"", notes:""},
      attach:[], attachOther:"",
      ack:false
    };
  }

  var pendingTarget = null;
  var fileInput = document.createElement("input");
  fileInput.type = "file"; fileInput.accept = "image/*"; fileInput.capture = "environment";
  fileInput.style.display = "none";
  document.body.appendChild(fileInput);
  fileInput.addEventListener("change", function(e){
    var f = e.target.files[0];
    fileInput.value = "";
    if(!f || !pendingTarget) return;
    resizeImage(f, 1400, function(dataUrl){
      if(pendingTarget.type === "step"){
        state.cur.photos[pendingTarget.id] = dataUrl;
        delete state.cur.naFlags[pendingTarget.id];
      } else if(pendingTarget.type === "damage"){
        pendingTarget.item.dataUrl = dataUrl;
      }
      pendingTarget = null;
      render();
    });
  });

  function resizeImage(file, maxDim, cb){
    var img = new Image();
    var reader = new FileReader();
    reader.onload = function(ev){
      img.onload = function(){
        var w = img.width, h = img.height, scale = Math.min(1, maxDim / Math.max(w,h));
        var cw = Math.round(w*scale), ch = Math.round(h*scale);
        var canvas = document.createElement("canvas");
        canvas.width = cw; canvas.height = ch;
        canvas.getContext("2d").drawImage(img, 0, 0, cw, ch);
        cb(canvas.toDataURL("image/jpeg", 0.82));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  function openCamera(target){ pendingTarget = target; fileInput.click(); }

  var videoInput = document.createElement("input");
  videoInput.type = "file"; videoInput.accept = "video/*"; videoInput.capture = "environment";
  videoInput.style.display = "none";
  document.body.appendChild(videoInput);
  videoInput.addEventListener("change", function(e){
    var f = e.target.files[0];
    videoInput.value = "";
    if(!f) return;
    state.cur.video = {file:f, name:f.name || "video", size:f.size, url:URL.createObjectURL(f), na:false};
    render();
  });

  function formatBytes(n){
    if(!n) return "";
    var mb = n/1048576;
    return mb>=1 ? mb.toFixed(1)+" MB" : Math.round(n/1024)+" KB";
  }

  function el(html){
    var t = document.createElement("template");
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }
  function on(node, evt, fn){ node.addEventListener(evt, fn); return node; }
  function esc(s){ return (s||"").replace(/[&<>"']/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }

  var STAGE_ORDER = ["category","basicInfo","photos","video","condition","attachments","review"];

  function currentCategory(){ return state.cur.category ? CATEGORIES[state.cur.category] : null; }
  function hasAttachPhase(){ var c = currentCategory(); return c && c.attachments; }
  function activeStages(){
    return STAGE_ORDER.filter(function(s){ return s!=="attachments" || hasAttachPhase(); });
  }
  function stageIndex(){
    var s = state.screen;
    if(s==="welcome") return -1;
    if(s==="lotSaved"||s==="finish") return activeStages().length;
    return activeStages().indexOf(s);
  }

  function photoStepDone(step){
    return !!state.cur.photos[step.id] || !!state.cur.naFlags[step.id];
  }
  function allPhotosDone(){
    var cat = currentCategory(); if(!cat) return false;
    return cat.steps.every(photoStepDone);
  }
  function missingPhotoCount(){
    var cat = currentCategory(); if(!cat) return 0;
    return cat.steps.filter(function(s){ return !photoStepDone(s); }).length;
  }
  function basicInfoDone(){
    var i = state.cur.info;
    return i.make.trim() && i.model.trim() && (i.serial||"").trim();
  }

  function renderTopbar(root){
    var top = el('<header class="topbar"></header>');
    var brandLabel = state.screen==="welcome" ? "Start a new lot" :
      (currentCategory() ? currentCategory().label : "Equipment Self-Catalog");
    top.appendChild(el(
      '<div class="brandrow">'+
        '<div class="brand">Bright Star Auctions<small>'+esc(brandLabel)+'</small></div>'+
        '<div class="lotbadge">LOT '+state.lotNum+(state.lots.length? " · "+state.lots.length+" saved":"")+'</div>'+
      '</div>'
    ));
    var idx = stageIndex();
    if(idx >= 0){
      var stages = activeStages();
      var track = el('<div class="stagetrack"></div>');
      stages.forEach(function(s, i2){
        var cls = i2 < idx ? "done" : (i2===idx ? "active" : "");
        track.appendChild(el('<i class="'+cls+'"></i>'));
      });
      top.appendChild(track);
    }
    root.appendChild(top);
  }

  function screenHeader(main, stageLabel, title, sub){
    if(stageLabel) main.appendChild(el('<p class="stagelabel">'+esc(stageLabel)+'</p>'));
    main.appendChild(el('<h1 class="screentitle">'+esc(title)+'</h1>'));
    if(sub) main.appendChild(el('<p class="sub">'+sub+'</p>'));
  }

  function render(){
    var app = document.getElementById("app");
    app.innerHTML = "";
    renderTopbar(app);
    var main = el('<main></main>');
    app.appendChild(main);

    if(state.screen==="welcome") return renderWelcome(main, app);
    if(state.screen==="category") return renderCategory(main, app);
    if(state.screen==="basicInfo") return renderBasicInfo(main, app);
    if(state.screen==="photos") return renderPhotos(main, app);
    if(state.screen==="video") return renderVideo(main, app);
    if(state.screen==="condition") return renderCondition(main, app);
    if(state.screen==="attachments") return renderAttachments(main, app);
    if(state.screen==="review") return renderReview(main, app);
    if(state.screen==="lotSaved") return renderLotSaved(main, app);
    if(state.screen==="finish") return renderFinish(main, app);
  }

  function renderFooter(app, backFn, nextLabel, nextFn, nextDisabled){
    var foot = el('<footer class="navbar"></footer>');
    if(backFn){
      foot.appendChild(on(el('<button class="btn ghost">Back</button>'), "click", backFn));
    }
    var nb = el('<button class="btn primary">'+esc(nextLabel)+'</button>');
    if(nextDisabled) nb.disabled = true;
    on(nb, "click", nextFn);
    foot.appendChild(nb);
    app.appendChild(foot);
  }

  function renderWelcome(main, app){
    main.appendChild(el(
      '<div class="card tagcard center">'+
        '<div class="bigicon">🚜</div>'+
        '<h1 class="screentitle">Catalog Your Equipment</h1>'+
        '<p class="sub" style="margin:0 auto;">A guided, step-by-step walkthrough so your listing looks professional — '+
        'the same shots and details our own catalogers capture, in an order that\'s hard to mess up.</p>'+
      '</div>'
    ));
    main.appendChild(el(
      '<div class="callout">'+
        '<h3>Before you start</h3>'+
        '<ol>'+
          '<li><b>One item at a time.</b> You\'ll pick a machine type, then work through a fixed shot list.</li>'+
          '<li><b>Good light matters more than a good camera.</b> Shoot outdoors, midday if possible, avoid deep shadows.</li>'+
          '<li><b>Say what you know — and what you don\'t.</b> The condition section keeps facts, what you observed, and your best guesses separate. That protects you and the buyer.</li>'+
          '<li><b>Our team reviews everything</b> before it goes live, same as always.</li>'+
        '</ol>'+
      '</div>'
    ));
    renderFooter(app, null, "Start First Lot", function(){ state.screen="category"; render(); });
  }

  function renderCategory(main, app){
    screenHeader(main, "Step 1 of "+activeStages().length, "What are you cataloging?",
      "Pick the closest match — this sets the exact photo list you'll follow.");
    var grid = el('<div class="catgrid"></div>');
    Object.keys(CATEGORIES).forEach(function(key){
      var c = CATEGORIES[key];
      var b = el('<button class="catbtn"><span class="name">'+esc(c.label)+'</span><span class="desc">'+esc(c.desc)+'</span></button>');
      on(b, "click", function(){
        state.cur.category = key;
        state.screen = "basicInfo";
        render();
      });
      grid.appendChild(b);
    });
    main.appendChild(grid);
    renderFooter(app, function(){ state.screen="welcome"; render(); }, "Next", function(){}, true);
    app.querySelector("footer .btn.primary").style.display = "none";
  }

  function fieldRow(label, hint, value, oninput, opts){
    opts = opts || {};
    var wrap = el('<div class="field"></div>');
    wrap.appendChild(el('<label>'+esc(label)+(hint?' <span class="hint">— '+esc(hint)+'</span>':'')+'</label>'));
    var inp = el('<input type="'+(opts.type||"text")+'">');
    inp.value = value || "";
    if(opts.placeholder) inp.placeholder = opts.placeholder;
    on(inp, "input", function(e){ oninput(e.target.value); });
    wrap.appendChild(inp);
    return wrap;
  }

  function renderBasicInfo(main, app){
    screenHeader(main, "Step 2 of "+activeStages().length, "Basic details",
      "Grab these off the machine itself where you can — the serial plate and title, not memory.");
    var card = el('<div class="card"></div>');
    var i = state.cur.info;
    var grid = el('<div class="grid2"></div>');
    grid.appendChild(fieldRow("Make", null, i.make, function(v){ i.make=v; }, {placeholder:"John Deere"}));
    grid.appendChild(fieldRow("Model", null, i.model, function(v){ i.model=v; }, {placeholder:"310SL"}));
    grid.appendChild(fieldRow("Year", null, i.year, function(v){ i.year=v; }, {placeholder:"2019", type:"text"}));
    grid.appendChild(fieldRow("Hour / odometer reading", null, i.meter, function(v){ i.meter=v; }, {placeholder:"4,215"}));
    card.appendChild(grid);
    card.appendChild(fieldRow("Serial / VIN / PIN", "must match the plate you'll photograph next", i.serial, function(v){ i.serial=v; }, {placeholder:"1FT..."}));
    card.appendChild(fieldRow("Where is it located?", "city/county is fine", i.location, function(v){ i.location=v; }, {placeholder:"Salina, KS"}));
    card.appendChild(fieldRow("Your name", "so we can reach you with questions", i.seller, function(v){ i.seller=v; }));
    main.appendChild(card);
    renderFooter(app,
      function(){ state.screen="category"; render(); },
      "Next: Photos",
      function(){
        if(!basicInfoDone()){ alert("Make, model, and serial number are required before moving on."); return; }
        state.photoIndex = 0; state.screen="photos"; render();
      }
    );
  }

  function renderPhotos(main, app){
    var cat = currentCategory();
    var step = cat.steps[state.photoIndex];
    screenHeader(main, "Step 3 of "+activeStages().length+" — Photo "+(state.photoIndex+1)+" of "+cat.steps.length, step.title, step.instr);

    var card = el('<div class="card photostep"></div>');
    var meta = el('<div class="stepmeta"><span class="stepcount">SHOT '+(state.photoIndex+1)+' / '+cat.steps.length+'</span>'+
      (step.naAllowed? '' : '<span class="req">Required</span>')+'</div>');
    card.appendChild(meta);

    var frame = el('<div class="frame"></div>');
    var photo = state.cur.photos[step.id];
    var isNA = state.cur.naFlags[step.id];
    if(photo){
      frame.appendChild(el('<img src="'+photo+'">'));
    } else if(isNA){
      frame.appendChild(el('<div class="na">Marked not applicable</div>'));
    } else {
      frame.appendChild(el('<div class="placeholder">No photo yet — tap "Take Photo" below</div>'));
    }
    card.appendChild(frame);

    var btnrow = el('<div class="btnrow"></div>');
    var takeBtn = el('<button class="btn primary">'+(photo?"Retake Photo":"Take Photo")+'</button>');
    on(takeBtn, "click", function(){ openCamera({type:"step", id:step.id}); });
    btnrow.appendChild(takeBtn);
    if(step.naAllowed && !photo){
      var naBtn = el('<button class="btn ghost">'+(isNA?"Undo — Not Applicable":"Not Applicable")+'</button>');
      on(naBtn, "click", function(){
        if(isNA) delete state.cur.naFlags[step.id]; else state.cur.naFlags[step.id]=true;
        render();
      });
      btnrow.appendChild(naBtn);
    }
    card.appendChild(btnrow);
    if(step.tip) card.appendChild(el('<div class="tip">'+esc(step.tip)+'</div>'));
    main.appendChild(card);

    renderFooter(app,
      function(){
        if(state.photoIndex===0){ state.screen="basicInfo"; }
        else { state.photoIndex--; }
        render();
      },
      state.photoIndex === cat.steps.length-1 ? "Next: Video" : "Next Photo",
      function(){
        if(!photoStepDone(step)){ alert("Take a photo or mark this shot not applicable before continuing."); return; }
        if(state.photoIndex === cat.steps.length-1){ state.screen="video"; }
        else { state.photoIndex++; }
        render();
      }
    );
  }

  function renderVideo(main, app){
    screenHeader(main, "Step 4 of "+activeStages().length, "Operating video",
      "This is the single most convincing thing in the whole listing — buyers who see it running bid with more confidence.");

    main.appendChild(el(
      '<div class="callout">'+
        '<h3>What to capture — about 2 minutes</h3>'+
        '<ol>'+
          '<li>Start the engine — let the camera catch it starting and idling.</li>'+
          '<li>Move it under its own power — drive, track, or turn a short distance.</li>'+
          '<li>Cycle anything that moves — raise/lower the boom, bucket, blade, or attachment.</li>'+
          '<li>Walk a slow circle around it while recording, so buyers see all sides in motion.</li>'+
          '<li>Hold your phone sideways (landscape) and keep it steady.</li>'+
        '</ol>'+
      '</div>'
    ));

    var card = el('<div class="card photostep"></div>');
    var video = state.cur.video;
    var hasVideo = video && video.url;
    var isNA = video && video.na;
    var meta = el('<div class="stepmeta"><span class="stepcount">OPERATING VIDEO</span>'+(isNA? '' : '<span class="req">Required</span>')+'</div>');
    card.appendChild(meta);

    var frame = el('<div class="frame"></div>');
    if(hasVideo){
      var vtag = el('<video controls style="width:100%;height:100%;object-fit:contain;background:#000;"></video>');
      vtag.src = video.url;

      list.appendChild(el('<div class="empty">No lots saved yet.</div>'));

      state.lots.forEach(function(lot, i2){
        var shotCount = Object.keys(lot.photos).length;
        var pill = lot.uploaded ? '<span class="pill good">Sent to Bright Star</span>' : '<span class="pill warn">Not sent — see below</span>';
        var chip = el(
          '<div class="lotchip"><div><div class="nm">Lot '+(i2+1)+' — '+esc(lot.info.make)+' '+esc(lot.info.model)+'</div>'+

      ? "At least one lot above could not reach Bright Star automatically, likely a weak connection. Download the packet below (and any videos) and email them to "+EMAIL_TO+" so nothing is lost."

    main.appendChild(el(
      '<div class="callout"><h3>'+(anyFailed?"Some lots need a manual backup":"All sent")+'</h3>'+

    ));

    var btns = el('<div class="btnrow" style="flex-direction:column;"></div>');

      var copyEmailBtn = el('<button class="btn full">Copy Bright Star\'s Email Address</button>');

      on(copyBtn, "click", copySummary);
      btnList.push(copyEmailBtn, copyBtn);
    }
    var moreBtn = el('<button class="btn '+(anyFailed?"ghost":"primary")+' full">Catalog Another Item</button>');

    main.appendChild(btns);

  function downloadVideo(lot){
    var a = document.createElement("a");
    a.href = lot.video.url;
    a.download = dateStamp()+" "+(lot.info.make||"Equipment")+" "+(lot.info.model||"")+" - "+lot.video.name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }

  function copyText(text, msg){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ alert(msg||"Copied."); });
    } else {
      var ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta);
      ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
      alert(msg||"Copied.");
    }
  }

  function dateStamp(){
    var d = new Date();
    function p(n){ return String(n).padStart(2,"0"); }
    return String(d.getFullYear()).slice(2)+"."+p(d.getMonth()+1)+"."+p(d.getDate());
  }

  function summaryText(){
    var out = ["BRIGHT STAR AUCTIONS — EQUIPMENT SELF-CATALOG SUBMISSION", "Generated "+new Date().toLocaleString(), ""];
    state.lots.forEach(function(lot, i2){
      var cat = CATEGORIES[lot.category];
      out.push("=== LOT "+(i2+1)+" — "+cat.label+" ===");
      out.push("Make/Model: "+lot.info.make+" "+lot.info.model);
      out.push("Year: "+(lot.info.year||"—"));
      out.push("Serial/VIN: "+lot.info.serial);
      out.push("Hour/odometer: "+(lot.info.meter||"—"));
      out.push("Location: "+(lot.info.location||"—"));
      out.push("Seller: "+(lot.info.seller||"—"));
      out.push("Photos captured: "+Object.keys(lot.photos).length+"/"+cat.steps.length);
      out.push("Video: "+(lot.video && lot.video.url ? lot.video.name+" ("+formatBytes(lot.video.size)+") — download and attach separately" : (lot.video && lot.video.na ? "not applicable" : "not recorded")));
      out.push("Starts: "+lot.cond.starts+" | Moves: "+lot.cond.moves+" | Hydraulics: "+lot.cond.hydraulics);
      out.push("Warning lights: "+lot.cond.lights+" | Leaks: "+lot.cond.leaks+" | Maintenance records: "+lot.cond.records);
      if(lot.cond.issues) out.push("Known issues: "+lot.cond.issues);
      if(lot.cond.notes) out.push("Notes: "+lot.cond.notes);
      if(lot.attach && lot.attach.length) out.push("Included: "+lot.attach.concat(lot.attachOther?[lot.attachOther]:[]).join(", "));
      out.push("");
    });
    return out.join("\n");
  }

  function copySummary(){
    copyText(summaryText(), "Summary copied — paste it into your email.");
  }

  function downloadPacket(){
    var html = buildPacketHtml();
    var blob = new Blob([html], {type:"text/html"});
    var url = URL.createObjectURL(blob);
    var filename = dateStamp()+" Equipment Catalog Submission.html";
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    return filename;
  }

        '<tr><td class="k">Starts / Moves / Hydraulics</td><td>'+esc(lot.cond.starts)+' / '+esc(lot.cond.moves)+' / '+esc(lot.cond.hydraulics)+'</td></tr>'+
        '<tr><td class="k">Warning lights / Leaks</td><td>'+esc(lot.cond.lights)+' / '+esc(lot.cond.leaks)+'</td></tr>'+
        '<tr><td class="k">Maintenance records</td><td>'+esc(lot.cond.records)+'</td></tr>'+
        '<tr><td class="k">Operating video</td><td>'+esc(lot.video && lot.video.url ? lot.video.name+" ("+formatBytes(lot.video.size)+") — sent as a separate attachment, not embedded" : (lot.video && lot.video.na ? "Not applicable" : "Not recorded"))+'</td></tr>'+
        (lot.cond.issues? '<tr><td class="k">Known issues</td><td>'+esc(lot.cond.issues)+'</td></tr>':'')+
        (lot.cond.notes? '<tr><td class="k">Notes</td><td>'+esc(lot.cond.notes)+'</td></tr>':'')+
        (lot.attach && lot.attach.length? '<tr><td class="k">Included</td><td>'+esc(lot.attach.concat(lot.attachOther?[lot.attachOther]:[]).join(", "))+'</td></tr>':'')+
        '</table>');
      parts.push('<div class="grid">');
      cat.steps.forEach(function(s){
        var photo = lot.photos[s.id];
        if(photo) parts.push('<figure><img src="'+photo+'"><figcaption>'+esc(s.title)+'</figcaption></figure>');
      });
      lot.damage.forEach(function(d, di){
        if(d.dataUrl) parts.push('<figure><img src="'+d.dataUrl+'"><figcaption>Issue: '+esc(d.note||"(no note)")+'</figcaption></figure>');
      });
      parts.push('</div>');
    });
    parts.push("</body></html>");
    return parts.join("\n");
  }

  render();
})();
</script>
</body>
</html>
